# Production-grade alternative to fetch-secrets.sh: the Secrets Store
# CSI Driver + Azure Key Vault provider pulls the secrets automatically
# and keeps them in sync — no script to re-run when a secret rotates.
# Install on the cluster first:
# https://learn.microsoft.com/azure/aks/csi-secrets-store-driver
#
# Secret names below match modules/azuread-oidc-app/keyvault.tf:
# "${secret_name_prefix}-client-id" and "${secret_name_prefix}-client-secret"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: my-app-oidc-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    # Uses the cluster's own managed identity — no extra credential
    # needs to be stored just to go fetch this one.
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<kubelet-identity-client-id>"
    keyvaultName: "<key-vault-name>"
    tenantId: "<azure-tenant-id>"
    objects: |
      array:
        - |
          objectName: app-my-oidc-app-client-id
          objectType: secret
        - |
          objectName: app-my-oidc-app-client-secret
          objectType: secret


  secretObjects:
    - secretName: oidc-app-credentials
      type: Opaque
      data:
        - objectName: app-my-oidc-app-client-id
          key: client-id
        - objectName: app-my-oidc-app-client-secret
          key: client-secret
