<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Step-by-step architecture of the azuread-oidc-app module</title>
<desc>Six steps: define inputs, create application, create service principal, assign roles, publish to key vault, app signs users in.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.gray{fill:#f8fafc;stroke:#cbd5e1;}
.blue{fill:#eff6ff;stroke:#93c5fd;}
.purple{fill:#faf5ff;stroke:#d8b4fe;}
.coral{fill:#fff1f2;stroke:#fda4af;}
.circ{fill:#ffffff;stroke:#475569;stroke-width:1.5;}
.th{font:600 14px sans-serif;fill:#1e293b;}
.ts{font:12px sans-serif;fill:#475569;}
.num{font:600 13px sans-serif;fill:#1e293b;}
.arr{stroke:#475569;stroke-width:1.5;fill:none;}
</style>

<line x1="340" y1="72" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="164" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="340" y2="296" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="348" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="440" x2="340" y2="480" class="arr" marker-end="url(#arrow)"/>

<circle cx="90" cy="46" r="16" class="circ"/><text class="num" x="90" y="46" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="120" y="20" width="440" height="52" rx="8" class="gray"/>
<text class="th" x="340" y="38" text-anchor="middle">Define inputs</text>
<text class="ts" x="340" y="56" text-anchor="middle">roles, role_assignments, redirect_uris</text>

<circle cx="90" cy="138" r="16" class="circ"/><text class="num" x="90" y="138" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="120" y="112" width="440" height="52" rx="8" class="blue"/>
<text class="th" x="340" y="130" text-anchor="middle">Create Application</text>
<text class="ts" x="340" y="148" text-anchor="middle">azuread_application + dynamic roles</text>

<circle cx="90" cy="230" r="16" class="circ"/><text class="num" x="90" y="230" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="120" y="204" width="440" height="52" rx="8" class="blue"/>
<text class="th" x="340" y="222" text-anchor="middle">Create Service Principal</text>
<text class="ts" x="340" y="240" text-anchor="middle">tenant instance of the app</text>

<circle cx="90" cy="322" r="16" class="circ"/><text class="num" x="90" y="322" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="120" y="296" width="440" height="52" rx="8" class="purple"/>
<text class="th" x="340" y="314" text-anchor="middle">Assign Roles</text>
<text class="ts" x="340" y="332" text-anchor="middle">one assignment per principal</text>

<circle cx="90" cy="414" r="16" class="circ"/><text class="num" x="90" y="414" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="120" y="388" width="440" height="52" rx="8" class="coral"/>
<text class="th" x="340" y="406" text-anchor="middle">Publish to Key Vault</text>
<text class="ts" x="340" y="424" text-anchor="middle">client-id, client-secret, allowed-principals</text>

<circle cx="90" cy="506" r="16" class="circ"/><text class="num" x="90" y="506" text-anchor="middle" dominant-baseline="central">6</text>
<rect x="120" y="480" width="440" height="52" rx="8" class="gray"/>
<text class="th" x="340" y="498" text-anchor="middle">App signs users in</text>
<text class="ts" x="340" y="516" text-anchor="middle">reads secrets, authenticates via OIDC</text>
</svg>
