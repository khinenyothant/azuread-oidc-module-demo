<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>High-level authentication and authorization flow</title>
<desc>A user's browser initiates an auth request to Azure AD, receives an identity token, passes it to the app, the app verifies it against Azure AD, reads its own credentials from Key Vault, and grants or denies access based on the role in the token.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.blue{fill:#eff6ff;stroke:#93c5fd;}
.purple{fill:#faf5ff;stroke:#d8b4fe;}
.coral{fill:#fff1f2;stroke:#fda4af;}
.gray{fill:#f8fafc;stroke:#cbd5e1;}
.th{font:600 14px sans-serif;fill:#1e293b;}
.ts{font:12px sans-serif;fill:#475569;}
.arr{stroke:#475569;stroke-width:1.5;fill:none;}
</style>

<!-- Azure AD -->
<polygon points="420,45 465,90 420,135 375,90" class="blue" stroke-width="0.5"/>
<circle cx="420" cy="90" r="5" fill="none" stroke="#475569"/>
<circle cx="420" cy="75" r="3" fill="#475569"/><circle cx="420" cy="105" r="3" fill="#475569"/>
<circle cx="405" cy="90" r="3" fill="#475569"/><circle cx="435" cy="90" r="3" fill="#475569"/>
<text class="th" x="420" y="160" text-anchor="middle">Azure AD</text>

<!-- Browser -->
<rect x="55" y="290" width="70" height="60" rx="4" class="gray" stroke-width="0.5"/>
<rect x="82" y="350" width="16" height="12" class="gray" stroke-width="0.5"/>
<rect x="68" y="362" width="44" height="6" rx="2" class="gray" stroke-width="0.5"/>
<text class="th" x="90" y="392" text-anchor="middle">Browser</text>

<!-- App -->
<polygon points="390,300 450,300 480,330 450,360 390,360 360,330" class="purple" stroke-width="0.5"/>
<text class="th" x="420" y="332" text-anchor="middle">Your App</text>

<!-- Key Vault -->
<rect x="555" y="300" width="110" height="60" rx="8" class="coral" stroke-width="0.5"/>
<rect x="600" y="318" width="20" height="14" rx="2" class="coral" stroke-width="0.5"/>
<path d="M604 318 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#475569"/>
<text class="th" x="610" y="392" text-anchor="middle">Key Vault</text>

<line x1="125" y1="300" x2="395" y2="115" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="235" y="185" text-anchor="middle">1. Initiate auth request</text>

<line x1="405" y1="125" x2="128" y2="315" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="255" y="270" text-anchor="middle">2. Returns identity token</text>

<line x1="128" y1="330" x2="365" y2="330" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="246" y="320" text-anchor="middle">3. Pass identity token</text>

<line x1="410" y1="298" x2="410" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="138" x2="432" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="220" text-anchor="middle">4. Verify</text>
<text class="ts" x="470" y="235" text-anchor="middle">identity</text>

<line x1="482" y1="318" x2="553" y2="318" class="arr" marker-end="url(#arrow)"/>
<line x1="553" y1="342" x2="482" y2="342" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="518" y="295" text-anchor="middle">5. Read app</text>
<text class="ts" x="518" y="280" text-anchor="middle">credentials</text>

<line x1="365" y1="350" x2="128" y2="350" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="246" y="368" text-anchor="middle">6. Access allowed / denied (role from token)</text>
</svg>
